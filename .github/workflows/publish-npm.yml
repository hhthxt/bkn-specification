# Publish TypeScript package to npmjs (@kweaver-ai/bkn).
#
# Uses npm trusted publishing (OIDC provenance) — no NPM_TOKEN needed.
# Requires the package to be linked to this repo on npmjs.com.
#
# Manual run: optional input dry_run — build and test only; no npm publish.

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/test only; do not publish to npm"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "npm-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !((github.event_name == 'workflow_dispatch') && (inputs.dry_run == true)) }}
        run: npm publish --provenance --access public
